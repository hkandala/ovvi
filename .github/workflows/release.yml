name: release

# A version tag on main publishes a release (playbook/release.md); a tag with a suffix (v0.2.0-rc.1) a pre-release,
# which GitHub's "latest" skips.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write

# Two tags pushed together publish one after the other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # No secret here: the key signs in publish, which runs no build tools.
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags, and the commit count for the build number
      - name: the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: brew update --quiet && brew bundle
      - run: scripts/ci-herdr.sh
      - run: make lint
      - run: make test
      - run: make zip
      - run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > .build/notes.md
          plutil -extract CFBundleVersion raw .build/DerivedData/Build/Products/Release/Ovvi.app/Contents/Info.plist > .build/build
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            .build/Ovvi-*.zip
            .build/SHA256SUMS
            .build/notes.md
            .build/build
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: .build
      - name: publish
        run: |
          version=${GITHUB_REF_NAME#v} zip=Ovvi-${GITHUB_REF_NAME#v}.zip
          url=https://github.com/hkandala/ovvi/releases/download/$GITHUB_REF_NAME
          scripts/appcast.sh Ovvi ".build/$zip" "$url/$zip" "$version" "$(cat .build/build)" .build/notes.md \
            > .build/appcast.xml
          printf '\n---\n\nInstall it: `curl -fsSL %s/install.sh | sh -s -- --version %s`\n' "$url" "$version" |
            cat .build/notes.md - |
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Ovvi $version" --notes-file - \
              $([[ $version == *-* ]] && echo --prerelease) ".build/$zip" .build/SHA256SUMS .build/appcast.xml \
              scripts/install.sh
