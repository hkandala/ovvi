name: ci

on:
  push:
    branches: [main]
    paths-ignore: &docs-only [playbook/**, docs/**, '**/*.md']
  pull_request:
    paths-ignore: *docs-only
  # Ad-hoc UI tests: gh workflow run ci.yml --ref main -f only_testing=OvviUITests/OvviUITests/testA,...
  # The on-demand tests (Makefile's ON_DEMAND): gh workflow run ci.yml --ref main -f on_demand=true
  workflow_dispatch:
    inputs:
      only_testing:
        description: Comma-separated -only-testing ids; empty runs everything
        default: ''
      on_demand:
        description: Run only the on-demand tests (stress, costs, frame records, look scenes), on 4 machines
        type: boolean
        default: false

permissions:
  contents: read

# Xcode's compilation cache (the Makefile passes XCODEFLAGS), one per commit: the checks save it, and a dispatch's
# build restores it, or the newest one on a commit the checks did not build. It keeps the compiler's outputs by their
# inputs, so a hit gives the same output. A cold build fills about 520 MB.
env:
  XCODEFLAGS: COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_LIMIT_SIZE=1073741824

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with: &cas
          path: .build/DerivedData/CompilationCache.noindex
          key: xcode-cas-${{ github.sha }}
          restore-keys: xcode-cas-
      - run: brew update --quiet && brew bundle
      - run: scripts/ci-herdr.sh
      - run: make lint
      - run: make build
      - run: make build-tests
      - run: make test

  # A full or on-demand run builds once, and its test jobs run that build. A chosen-tests run builds in its one job.
  build:
    if: github.event_name == 'workflow_dispatch' && !inputs.only_testing
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Saved only on a miss: the checks saved main's commits.
      - uses: actions/cache@v6
        with: *cas
      # The e2e helper's tools build beside the app, not before each shard's tests.
      - run: |
          python3 scripts/e2e-helper.py --tools .build/e2e-tools &
          make build-tests
          wait $!
      # A tar keeps the bundles' symlinks and modes, which the artifact's zip drops.
      - run: tar -cf products.tar .build/DerivedData/Build/Products .build/e2e-tools
      - uses: actions/upload-artifact@v7
        with:
          name: products
          path: products.tar
          compression-level: 1
          retention-days: 1

  # 5 shards: the account's limit of parallel macOS jobs.
  test:
    needs: build
    # A chosen-tests run skips build.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.build.result == 'success' || inputs.only_testing) }}
    runs-on: xcode-27
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only_testing && '[0]' || inputs.on_demand && '[0, 1, 2, 3]' || '[0, 1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v7
      - if: ${{ inputs.only_testing }}
        uses: actions/cache/restore@v6
        with: *cas
      - if: ${{ !inputs.only_testing }}
        uses: actions/download-artifact@v8
        with:
          name: products
      - if: ${{ !inputs.only_testing }}
        run: tar -xf products.tar && rm products.tar
      # The tests are tuned to a 1024 x 768 pt screen at 1x; the macOS 27.2 image boots at 1920 x 1080.
      - run: clang -fobjc-arc -framework Foundation -framework CoreGraphics scripts/ci-display.m -o /tmp/ci-display &&
          /tmp/ci-display 1024 768
      # The image has xcbeautify and node.
      - run: scripts/ci-herdr.sh
      - run: scripts/ci-sshd.sh
      # CI has no coding agents: stand-ins go on the login shell's PATH, here and on the remote machine.
      - run: |
          agents="$PWD/OvviUITests/Fixtures/agents"
          echo "export PATH=\"\$PATH:$agents:$agents/codex\"" | tee -a ~/.zshrc >> ~/.bash_profile
      - if: ${{ inputs.only_testing }}
        run: make e2e
        env:
          ONLY: ${{ inputs.only_testing }}
      - if: ${{ !inputs.only_testing }}
        run: make e2e PREBUILT=1 SHARD=${{ matrix.shard }}/${{ strategy.job-total }} ${{ inputs.on_demand && 'ON_DEMAND_ONLY=1' || '' }}
        env:
          E2E_TOOLS: ${{ github.workspace }}/.build/e2e-tools
      - if: failure()
        run: tail -60 /tmp/ovvi-sshd/sshd.log; pgrep -lf 'ssh ' || true
      # Green runs too: their screen recordings show what a change looks like.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult-${{ matrix.shard }}
          path: .build/DerivedData/e2e.xcresult
          # Mostly screen recordings, which a zip cannot shrink.
          compression-level: 0
