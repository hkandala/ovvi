name: ci

on:
  push:
    branches: [main]
    paths-ignore: &docs-only [playbook/**, docs/**, resources/**, '**/*.md']
  pull_request:
    paths-ignore: *docs-only
  # Ad-hoc UI tests: gh workflow run ci.yml --ref main -f only_testing=OvviUITests/OvviUITests/testA,...
  # The on-demand tests (Makefile's ON_DEMAND): gh workflow run ci.yml --ref main -f on_demand=true
  workflow_dispatch:
    inputs:
      only_testing:
        description: Comma-separated -only-testing ids; empty runs everything
        default: ''
      on_demand:
        description: Run only the on-demand tests (stress, costs, frame records, look scenes), on 4 machines
        type: boolean
        default: false

env:
  HERDR_VERSION: 0.9.5
  HERDR_SHA256: fb77c2232a05a8035421382c894392f4174e4e38a18e48af3dd0290157c3a7e2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: brew update --quiet && brew bundle
      - name: install herdr
        run: &install-herdr |
          mkdir -p ~/.local/bin
          curl -fsSL -o ~/.local/bin/herdr "https://github.com/herdrdev/herdr/releases/download/v$HERDR_VERSION/herdr-macos-aarch64"
          echo "$HERDR_SHA256  $HOME/.local/bin/herdr" | shasum -a 256 -c
          chmod +x ~/.local/bin/herdr
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The app finds herdr through the login shell, like a user's rc file after install.
          echo 'export PATH="$HOME/.local/bin:$PATH"' | tee -a ~/.zshrc >> ~/.bash_profile
      - run: make lint
      - run: make build
      - run: make build-tests
      - run: make test

  # A full or on-demand run builds once, and its test jobs run that build. A chosen-tests run builds in its one job.
  build:
    if: github.event_name == 'workflow_dispatch' && !inputs.only_testing
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make build-tests
      # A tar keeps the bundles' symlinks and modes, which the artifact's zip drops.
      - run: tar -cf products.tar -C .build/DerivedData/Build Products
      - uses: actions/upload-artifact@v7
        with:
          name: products
          path: products.tar
          compression-level: 1
          retention-days: 1

  # 5 shards: the account's limit of parallel macOS jobs.
  test:
    needs: build
    # Also when build was skipped (a chosen-tests run).
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.build.result != 'failure' }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only_testing && '[0]' || inputs.on_demand && '[0, 1, 2, 3]' || '[0, 1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v7
      - if: ${{ !inputs.only_testing }}
        uses: actions/download-artifact@v8
        with:
          name: products
      - if: ${{ !inputs.only_testing }}
        run: mkdir -p .build/DerivedData/Build && tar -xf products.tar -C .build/DerivedData/Build
      # The image has xcbeautify and node.
      - name: install herdr
        run: *install-herdr
      - run: scripts/ci-sshd.sh
      # CI has no coding agents: stand-ins go on the login shell's PATH, here and on the remote machine.
      - run: |
          agents="$PWD/OvviUITests/Fixtures/agents"
          echo "export PATH=\"\$PATH:$agents:$agents/codex\"" | tee -a ~/.zshrc >> ~/.bash_profile
      - if: ${{ inputs.only_testing }}
        run: make e2e
        env:
          ONLY: ${{ inputs.only_testing }}
      - if: ${{ !inputs.only_testing }}
        run: make e2e PREBUILT=1 SHARD=${{ matrix.shard }}/${{ strategy.job-total }} ${{ inputs.on_demand && 'ON_DEMAND_ONLY=1' || '' }}
      - if: failure()
        run: tail -60 /tmp/ovvi-sshd/sshd.log; pgrep -lf 'ssh ' || true
      # Green runs too: their screen recordings are the phases' screenshots.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult-${{ matrix.shard }}
          path: .build/DerivedData/e2e.xcresult
