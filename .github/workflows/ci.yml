name: ci

on:
  push:
    branches: [main]
    paths-ignore: &docs-only [playbook/**, docs/**, resources/**, '**/*.md']
  pull_request:
    paths-ignore: *docs-only
  # Ad-hoc UI tests: gh workflow run ci.yml --ref main -f only_testing=OvviUITests/OvviUITests/testA,...
  # The on-demand tests (Makefile's ON_DEMAND): gh workflow run ci.yml --ref main -f on_demand=true
  workflow_dispatch:
    inputs:
      only_testing:
        description: Comma-separated -only-testing ids; empty runs everything
        default: ''
      on_demand:
        description: Run only the on-demand tests (stress, costs, frame records, look scenes), on 4 machines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: brew update --quiet && brew bundle
      - run: scripts/ci-herdr.sh
      - run: make lint
      - run: make build
      - run: make build-tests
      - run: make test

  # A full or on-demand run builds once, and its test jobs run that build. A chosen-tests run builds in its one job.
  build:
    if: github.event_name == 'workflow_dispatch' && !inputs.only_testing
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make build-tests
      # A tar keeps the bundles' symlinks and modes, which the artifact's zip drops.
      - run: tar -cf products.tar .build/DerivedData/Build/Products
      - uses: actions/upload-artifact@v7
        with:
          name: products
          path: products.tar
          compression-level: 1
          retention-days: 1

  # 5 shards: the account's limit of parallel macOS jobs.
  test:
    needs: build
    # A chosen-tests run skips build.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (needs.build.result == 'success' || inputs.only_testing) }}
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.only_testing && '[0]' || inputs.on_demand && '[0, 1, 2, 3]' || '[0, 1, 2, 3, 4]') }}
    steps:
      - uses: actions/checkout@v7
      - if: ${{ !inputs.only_testing }}
        uses: actions/download-artifact@v8
        with:
          name: products
      - if: ${{ !inputs.only_testing }}
        run: tar -xf products.tar && rm products.tar
      # The image has xcbeautify and node.
      - run: scripts/ci-herdr.sh
      - run: scripts/ci-sshd.sh
      # CI has no coding agents: stand-ins go on the login shell's PATH, here and on the remote machine.
      - run: |
          agents="$PWD/OvviUITests/Fixtures/agents"
          echo "export PATH=\"\$PATH:$agents:$agents/codex\"" | tee -a ~/.zshrc >> ~/.bash_profile
      - if: ${{ inputs.only_testing }}
        run: make e2e
        env:
          ONLY: ${{ inputs.only_testing }}
      - if: ${{ !inputs.only_testing }}
        run: make e2e PREBUILT=1 SHARD=${{ matrix.shard }}/${{ strategy.job-total }} ${{ inputs.on_demand && 'ON_DEMAND_ONLY=1' || '' }}
      - if: failure()
        run: tail -60 /tmp/ovvi-sshd/sshd.log; pgrep -lf 'ssh ' || true
      # Green runs too: their screen recordings show what a change looks like.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-xcresult-${{ matrix.shard }}
          path: .build/DerivedData/e2e.xcresult
